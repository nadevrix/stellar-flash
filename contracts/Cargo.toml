[workspace]
resolver = "2"
members = ["flash-bridge"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Stellar Flash contributors"]

[workspace.dependencies]
# Mainnet está en Protocolo 27 (sep-2026). soroban-sdk 27.x es la versión estable que lo soporta.
soroban-sdk = "27.0.6"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
