# Despliegue del secuenciador en Render.
#
# Notas importantes:
#  - `plan: starter` y el disco persistente NO son opcionales. El log SQLite es la fuente de
#    verdad del rollup: si se pierde en un redeploy, el estado L2 no se puede reconstruir.
#  - El servicio debe ser de **instancia única**. Dos secuenciadores firmando `commit_batch`
#    con la misma cuenta corrompen la secuencia. El disco persistente ya fuerza esto en Render.
#  - `SEQUENCER_SECRET` se configura a mano en el panel (sync: false): nunca en el repo.
services:
  - type: web
    name: stellar-flash-sequencer
    runtime: node
    plan: starter
    region: oregon
    branch: main
    # Un cambio en la landing NO debe reiniciar el secuenciador: reiniciarlo corta la
    # confirmación de pagos y vuelve a leer el contrato. Solo el backend lo redespliega.
    # Solo lo que el secuenciador ejecuta lo redespliega. Reiniciarlo corta la confirmación de
    # pagos y vuelve a leer el contrato, así que un cambio en la landing, el SDK o los docs no debe
    # tocarlo.
    buildFilter:
      paths:
        - sequencer/**
        - protocol/**
        - package.json
        - package-lock.json
    buildCommand: npm ci --omit=dev
    startCommand: node sequencer/src/index.ts
    healthCheckPath: /v1/health
    disk:
      name: flash-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: API_HOST
        value: 0.0.0.0
      - key: DB_PATH
        value: /var/data/flash.db
      - key: L1_MODE
        value: rpc
      - key: NETWORK_PASSPHRASE
        value: Test SDF Network ; September 2015
      - key: RPC_URLS
        value: https://soroban-testnet.stellar.org,https://stellar-soroban-testnet-public.nodies.app
      - key: ALLOWED_TOKENS
        value: CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC
      - key: CHALLENGE_PERIOD_LEDGERS
        value: "20"
      # Específicos del despliegue (contrato desplegado, llave y ledger inicial): en el panel.
      - key: BRIDGE_CONTRACT_ID
        sync: false
      - key: SEQUENCER_SECRET
        sync: false
      - key: DEPOSIT_SCAN_START_LEDGER
        sync: false

  - type: web
    name: stellar-flash
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - frontend/**
    # SPA: /explorer lo resuelve el router en el navegador, así que cualquier ruta
    # que no sea un fichero debe servir index.html en lugar de dar 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
