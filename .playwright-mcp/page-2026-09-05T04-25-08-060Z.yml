      - generic [ref=e46]:
        - paragraph [ref=e47]: The problem
        - heading "People send $1 first, just to see if it arrives." [level=2] [ref=e48]
        - generic [ref=e49]:
          - paragraph [ref=e50]:
            - text: It is the quiet tax on every crypto payment product. Before moving real money, users send a tiny test amount and wait — because they have seen a payment sit on
            - emphasis [ref=e51]: processing…
            - text: before, and nobody could tell them where it went.
          - paragraph [ref=e52]: Two transactions instead of one. Two waits. And a business that looks unsure of its own product.
          - paragraph [ref=e53]: The ledger is not the problem. Stellar closes blocks every five seconds and does it well. The problem is that five seconds is an eternity in a checkout, and that everything between your app and the ledger — RPC endpoints, indexers, propagation — can have a bad afternoon while the network itself is perfectly fine.
      - generic [ref=e54]:
        - generic [ref=e55]:
          - heading "Payments stuck on “processing”" [level=3] [ref=e56]
          - paragraph [ref=e57]: The transaction is submitted, the receipt is not there yet. The user reloads. Support gets a ticket.
        - generic [ref=e58]:
          - heading "Demos that look broken" [level=3] [ref=e59]
          - paragraph [ref=e60]: The network is fine; a public RPC is not. The audience only sees a spinner.
        - generic [ref=e61]:
          - heading "Bulk payouts that go missing" [level=3] [ref=e62]
          - paragraph [ref=e63]: Hundreds of payments from one account, sequence collisions, silent retries — and someone waits a week for their money.
    - generic [ref=e65]:
      - paragraph [ref=e66]: How it works
      - heading "A rollup, not a wallet with a database behind it." [level=2] [ref=e67]
      - paragraph [ref=e68]: Arbitrum made Ethereum fast by moving execution off-chain and keeping custody and proof on-chain. Flash does the same for Stellar payments.
      - list [ref=e69]:
        - listitem [ref=e70]:
          - generic [ref=e71]: "01"
          - heading "Deposit once" [level=3] [ref=e72]
          - paragraph [ref=e73]: Send XLM or USDC to the flash-bridge contract on Stellar. You get FXLM or FUSDC 1:1, on the very same G… address. This is the only step that waits for a ledger.
        - listitem [ref=e74]:
          - generic [ref=e75]: "02"
          - heading "Pay instantly" [level=3] [ref=e76]
          - paragraph [ref=e77]: Payments inside Flash are signed by the user (SEP-53, so existing wallets work) and confirmed in milliseconds. They never touch the L1, so an RPC outage cannot stall them.
        - listitem [ref=e78]:
          - generic [ref=e79]: "03"
          - heading "Settle in batches" [level=3] [ref=e80]
          - paragraph [ref=e81]: Flash seals batches and publishes them on Stellar, with the full transaction data on-chain. When the network is degraded it waits and keeps confirming; when it recovers, the backlog goes out in order.
        - listitem [ref=e82]:
          - generic [ref=e83]: "04"
          - heading "Withdraw whenever" [level=3] [ref=e84]
          - paragraph [ref=e85]: Burn on Flash, prove with a Merkle branch, get paid by the contract. If we disappeared tomorrow, the escape hatch still works — and no admin can pause it.
      - generic [ref=e86]: wallets ──signed payment (SEP-53)──▶ Flash sequencer ──── confirms in ~6 ms │ │ commit_batch (batch data on L1) ▼ Stellar · flash-bridge contract ── vault · roots · withdraw · escape
